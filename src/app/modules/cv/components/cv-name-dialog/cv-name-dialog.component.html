<div class="overlay" (click)="cancelled.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h3>Name your CV</h3>
    <p>Give this CV a label so you can tell your variants apart.</p>
    <input
      type="text"
      placeholder='e.g. "Fullstack Product", "Backend Heavy"'
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      (keydown.enter)="submit()"
      autofocus
    />
    <div class="actions">
      <button class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="!name().trim()">Upload</button>
    </div>
  </div>
</div>
