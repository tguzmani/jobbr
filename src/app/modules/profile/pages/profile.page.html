<div class="page">
  <div class="page-header">
    <h1>Profile</h1>
    @if (!editing()) {
      <button class="btn-primary" (click)="startEditing()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit
      </button>
    } @else {
      <div class="header-actions">
        <button class="btn-secondary" (click)="cancelEditing()">Cancel</button>
        <button class="btn-primary" (click)="saveProfile()" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    }
  </div>

  @if (profileService.isLoading()) {
    <app-loading-spinner />
  } @else {
    <div class="profile-card">
      @for (field of fields; track field.key) {
        <div class="field">
          <div class="field-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="field.icon"/></svg>
            <span>{{ field.label }}</span>
          </div>

          @if (editing()) {
            <input
              [type]="field.type"
              [placeholder]="field.placeholder"
              [ngModel]="formData()[field.key]"
              (ngModelChange)="updateField(field.key, $event)"
            />
          } @else {
            <div class="field-value">
              @if (profileService.profile()[field.key]) {
                <span class="value-text">{{ profileService.profile()[field.key] }}</span>
                <button class="copy-btn" (click)="copyToClipboard(field.key, profileService.profile()[field.key])" [title]="'Copy ' + field.label">
                  @if (copiedKey() === field.key) {
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5CB85C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  } @else {
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  }
                </button>
              } @else {
                <span class="empty-value">Not set</span>
              }
            </div>
          }
        </div>
      }
    </div>
  }
</div>
