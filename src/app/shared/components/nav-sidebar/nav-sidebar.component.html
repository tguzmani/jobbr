<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-header">
    <a routerLink="/dashboard" class="logo">
      <span class="logo-icon">J</span>
      @if (!collapsed()) {
        <span class="logo-text">Jobbr</span>
      }
    </a>
    <button class="collapse-btn" (click)="collapsed.set(!collapsed())">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        @if (collapsed()) {
          <polyline points="9 18 15 12 9 6"/>
        } @else {
          <polyline points="15 18 9 12 15 6"/>
        }
      </svg>
    </button>
  </div>

  <nav class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      @if (!collapsed()) { <span>Dashboard</span> }
    </a>
    <a routerLink="/applications" routerLinkActive="active" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      @if (!collapsed()) { <span>Applications</span> }
    </a>
    <a routerLink="/profile" routerLinkActive="active" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      @if (!collapsed()) { <span>Profile</span> }
    </a>
  </nav>

  <div class="sidebar-footer">
    @if (authService.currentUser(); as user) {
      <div class="user-section">
        <img [src]="user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName + '&background=0A66C2&color=fff'" class="avatar" [alt]="user.displayName || 'User'" />
        @if (!collapsed()) {
          <div class="user-info">
            <span class="user-name">{{ user.displayName }}</span>
            <span class="user-email">{{ user.email }}</span>
          </div>
        }
      </div>
      <button class="sign-out-btn" (click)="authService.signOut()" [title]="collapsed() ? 'Sign out' : ''">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        @if (!collapsed()) { <span>Sign out</span> }
      </button>
    }
  </div>
</aside>

<!-- Mobile bottom tab bar -->
<nav class="mobile-nav">
  <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    <span>Dashboard</span>
  </a>
  <a routerLink="/applications" routerLinkActive="active" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <span>Applications</span>
  </a>
  <a routerLink="/applications/new" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>Add</span>
  </a>
  <a routerLink="/profile" routerLinkActive="active" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Profile</span>
  </a>
</nav>
